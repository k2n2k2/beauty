<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>집쿡 로그인</title>

    <link rel="stylesheet" href="css/top.css">
    <link rel="stylesheet" href="css/down.css">
    <link rel="stylesheet" href="css/kukmain.css">

    <link rel="stylesheet" href="css/query.css">
    <link rel="stylesheet" href="css/log_in.css">
    <link rel="shortcut icon" href="images/icon_logo.png">
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
    <script src="js/log_in.js"></script>
    
    
   
    
</head>










<body>

    <!-- 로그인버전 -->
    <div class="modal">
        <ul class="log_in">


            <li class="mainlogo"><a href="index.html"><img src="images/login_mainlogo.jpg"></a></li>

            <h2>로그인</h2>
            <p class="txt">아이디와 비밀번호 입력하기 귀찮으시죠?
                <br>1초 로그인으로 입력없이 간편하게 집쿡을 즐기세요.
            </p>
            <li class="easylogo">
                <img src="images/login_logo.jpg" usemap="#log">
            </li>
            <map name="log">
                <area shape="rect" coords="11,9 39,34" href="https://accounts.kakao.com/login" title="카카오톡">
                <area shape="rect" coords="79,6 109,35" title="네이버" href="https://nid.naver.com/">
                <area shape="rect" coords="148,10 179,33" title="티월드" href="https://auth.skt-id.co.kr/">
                <area shape="rect" coords="219,12 251,35" title="애플" href="https://appleid.apple.com/">
                <area shape="rect" coords="292,8 321,34" title="페이코" href="https://id.payco.com/oauth2.0/">
                <area shape="rect" coords="360,11 389,36" title="문자or패스"
                    href="https://www.kmcert.com/kmcis/web_v4/kmcisHp00.jsp">
            </map>



            <p class="txt1"><span>또는</span></p>

            <!-- 아이디 비번로그 -->
            <li class="id"><input type="text" placeholder="아이디">
                
            </li>
            <li class="pass"><input type="password" placeholder="비밀번호(8~12자,영문+숫자+특수문자)" minlength="8" maxlength="12">
            </li>
            <li class="save"><input type="checkbox">아이디저장 
                <input type="checkbox">비밀번호저장</li>
            
            <li class="find"><a href="#a">아이디<span></span>비밀번호찾기</a></li>

            <li class="lo"><input type="submit" value="로그인"></li>
        </ul>


    </div>
     
    



</body>

</html>
